<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Converting a web-syntax search expression</title>
<desc id="fig-desc">convertSearchExpression() splits the input golang &quot;machine learning&quot; -php +(tutorial OR guide) into four terms. The unprefixed term golang is required and joined with AND. The phrase machine learning contains a space, so it is sent quoted. The required group +(tutorial OR guide) keeps its OR inside parentheses. The excluded term -php becomes AND NOT php. The resulting server query is golang AND &quot;machine learning&quot; AND (tutorial OR guide) AND NOT php, which is sent as a boolean expression: send with searchRaw(), or search() with queryMode: &#x27;boolean&#x27;.</desc>
<style>
