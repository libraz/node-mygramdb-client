<text class="lbl" x="194" y="43">USER INPUT · WEB SYNTAX</text>
<text class="mono" x="194" y="66">golang "machine learning" -php +(tutorial OR guide)</text>
<text class="mono" x="490" y="96">convertSearchExpression()</text>
<text class="mono" x="36" y="146">golang</text>
<text class="hb" x="36" y="168">Unprefixed term</text>
<text class="s" x="36" y="185">required, joined with AND</text>
<text class="mono" x="36" y="214">golang</text>
<text class="mono" x="269" y="146">"machine learning"</text>
<text class="hb" x="269" y="168">Phrase</text>
<text class="s" x="269" y="185">contains a space, so quoted</text>
<text class="mono" x="269" y="214">"machine learning"</text>
<text class="mono" x="502" y="146">+(tutorial OR guide)</text>
<text class="hb" x="502" y="168">Required group</text>
<text class="s" x="502" y="185">OR stays in parentheses</text>
<text class="mono" x="502" y="214">(tutorial OR guide)</text>
<text class="mono" x="735" y="146">-php</text>
<text class="hb" x="735" y="168">Excluded term</text>
<text class="s" x="735" y="185">joined with AND NOT</text>
<text class="mono" x="735" y="214">AND NOT php</text>
<text class="lbl" x="38" y="272">SERVER QUERY</text>
<text class="mono" x="38" y="298">golang AND "machine learning" AND (tutorial OR guide) AND NOT php</text>
<text class="s" x="922" y="298" text-anchor="end">send with searchRaw(), or search() with queryMode: 'boolean'</text>
<text class="s" x="480" y="342" text-anchor="middle">Every term is joined with AND; a term that is empty, a reserved word, or contains whitespace or quotes is sent quoted.</text>
</svg>
