<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">クライアントを通るリクエストの経路</title>
<desc id="fig-desc">アプリケーションは生の文字列をクライアントに渡します。クライアントは入力を検証し、すべての値に同じクォート規則を適用して、SEARCH articles &quot;machine learning&quot; FILTER status = &quot;AND&quot; LIMIT 10 のようなコマンドを TCP のテキストプロトコルで MygramDB サーバーへ送ります。サーバーはインメモリの n-gram インデックスから応答し、そのインデックスは MySQL から binlog レプリケーションで更新されます。応答を受け取るとき、クライアントはクォートされた主キーと値を元に戻し、数値コード付きの ERROR を型付きエラーに変換します。</desc>
<style>
  .bg{fill:#f8fafc} .grp{fill:#eef2f6} .chip{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
  .card{fill:#ffffff;stroke:#1d4ed8;stroke-width:1.4} .alt{fill:#ffffff;stroke:#c2410c;stroke-width:1.4}
  .seam{fill:none;stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 3}
  .ln{fill:none;stroke:#1d4ed8;stroke-width:1.4} .ah{fill:#1d4ed8}
  .ln2{fill:none;stroke:#c2410c;stroke-width:1.4} .ah2{fill:#c2410c}
  .lnd{fill:none;stroke:#1d4ed8;stroke-width:1.4;stroke-dasharray:5 4}
  text{font-family:"IBM Plex Sans","Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;fill:#334155}
  .h{font-size:12.5px;fill:#0f172a} .hb{font-size:12.5px;font-weight:600;fill:#0f172a}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#64748b}
  .s{font-size:10.5px;fill:#64748b}
  .mono{font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;font-size:11px;fill:#0f172a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .grp{fill:#161b22} .chip{fill:#1c2128;stroke:#3a4a63}
    .card{fill:#1c2128;stroke:#60a5fa} .alt{fill:#1c2128;stroke:#fb923c}
    .seam{stroke:#3a4a63}
    .ln{stroke:#60a5fa} .ah{fill:#60a5fa} .ln2{stroke:#fb923c} .ah2{fill:#fb923c} .lnd{stroke:#60a5fa}
    text{fill:#cbd5e1} .h,.hb,.mono{fill:#e8eefb} .lbl,.s{fill:#94a3b8}
  }
</style>
<rect class="bg" x="0" y="0" width="960" height="380" rx="10"/>
<rect class="alt" x="24" y="36" width="176" height="208" rx="8"/>
<rect class="grp" x="240" y="24" width="424" height="232" rx="8"/>
<rect class="chip" x="256" y="60" width="186" height="80" rx="6"/>
<rect class="chip" x="462" y="60" width="186" height="80" rx="6"/>
<rect class="chip" x="256" y="156" width="392" height="80" rx="6"/>
<rect class="card" x="712" y="36" width="224" height="208" rx="8"/>
<rect class="chip" x="712" y="276" width="224" height="70" rx="8"/>
<rect class="grp" x="24" y="276" width="640" height="70" rx="8"/>
<path class="ln" d="M200 100 H249"/>
<polygon class="ah" points="256,100 249,96 249,104"/>
<path class="ln" d="M442 100 H455"/>
<polygon class="ah" points="462,100 455,96 455,104"/>
<path class="ln" d="M648 100 H705"/>
<polygon class="ah" points="712,100 705,96 705,104"/>
<path class="ln2" d="M712 196 H655"/>
<polygon class="ah2" points="648,196 655,192 655,200"/>
<path class="ln2" d="M256 196 H207"/>
<polygon class="ah2" points="200,196 207,192 207,200"/>
<path class="lnd" d="M824 276 V251"/>
<polygon class="ah" points="824,244 820,251 828,251"/>
<text class="lbl" x="38" y="56">呼び出し側</text>
<text class="hb" x="38" y="76">アプリケーション</text>
<text class="mono" x="38" y="100">client.search(</text>
<text class="mono" x="38" y="116">  'articles', q, opts)</text>
<text class="s" x="38" y="138">生の文字列を渡す</text>
<text class="s" x="38" y="200">型付きの結果と</text>
<text class="s" x="38" y="215">エラーを受け取る</text>
<text class="lbl" x="254" y="45">クライアントライブラリ</text>
<text class="mono" x="650" y="45" text-anchor="end">mygramdb-client</text>
<text class="lbl" x="266" y="79">1</text>
<text class="hb" x="280" y="79">入力検証</text>
<text class="s" x="266" y="102">制御文字を拒否し、</text>
<text class="s" x="266" y="118">識別子を検証</text>
<text class="lbl" x="472" y="79">2</text>
<text class="hb" x="486" y="79">クォート処理</text>
<text class="s" x="472" y="102">検索語・フィルタ値・主キー・</text>
<text class="s" x="472" y="118">タグ・引数に同じ規則</text>
<text class="lbl" x="266" y="175">3</text>
<text class="hb" x="280" y="175">応答のデコード</text>
<text class="s" x="266" y="198">クォートされた主キーと値を元に戻し、</text>
<text class="s" x="266" y="214">ERROR &lt;code&gt; を型付きエラーに変換</text>
<text class="lbl" x="726" y="56">サーバー</text>
<text class="hb" x="726" y="76">MygramDB</text>
<text class="s" x="726" y="100">TCP 上のテキストプロトコル</text>
<text class="s" x="726" y="116">インメモリの n-gram インデックス</text>
<text class="s" x="726" y="132">管理コマンドは AUTH で保護</text>
<text class="lbl" x="726" y="182">応答</text>
<text class="mono" x="726" y="202">OK RESULTS 2 101 "doc 7"</text>
<text class="hb" x="726" y="302">MySQL</text>
<text class="s" x="726" y="322">正本。書き込みはこちら</text>
<text class="lbl" x="38" y="298">送信されるコマンド</text>
<text class="mono" x="38" y="324">SEARCH articles "machine learning" FILTER status = "AND" LIMIT 10</text>
<text class="s" x="814" y="264" text-anchor="end">binlog レプリケーション</text>
<text class="s" x="480" y="368" text-anchor="middle">呼び出し側は生の文字列を渡します。クライアントは送信時に 1 つの規則でクォートし、受信時にクォートを外します。</text>
</svg>
