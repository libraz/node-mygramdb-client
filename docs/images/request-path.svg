<text class="lbl" x="38" y="56">CALLER</text>
<text class="hb" x="38" y="76">Application</text>
<text class="mono" x="38" y="100">client.search(</text>
<text class="mono" x="38" y="116">  'articles', q, opts)</text>
<text class="s" x="38" y="138">raw, unquoted text</text>
<text class="s" x="38" y="200">typed results</text>
<text class="s" x="38" y="215">and typed errors</text>
<text class="lbl" x="254" y="45">CLIENT LIBRARY</text>
<text class="mono" x="650" y="45" text-anchor="end">mygramdb-client</text>
<text class="lbl" x="266" y="79">1</text>
<text class="hb" x="280" y="79">Validate</text>
<text class="s" x="266" y="102">control characters rejected,</text>
<text class="s" x="266" y="118">identifiers checked</text>
<text class="lbl" x="472" y="79">2</text>
<text class="hb" x="486" y="79">Wire quoting</text>
<text class="s" x="472" y="102">one rule for terms, filters,</text>
<text class="s" x="472" y="118">keys, tags and arguments</text>
<text class="lbl" x="266" y="175">3</text>
<text class="hb" x="280" y="175">Decode</text>
<text class="s" x="266" y="198">quoted primary keys and values are unquoted;</text>
<text class="s" x="266" y="214">an ERROR &lt;code&gt; frame becomes a typed error</text>
<text class="lbl" x="726" y="56">SERVER</text>
<text class="hb" x="726" y="76">MygramDB</text>
<text class="s" x="726" y="100">text protocol over TCP</text>
<text class="s" x="726" y="116">in-memory n-gram index</text>
<text class="s" x="726" y="132">admin commands gated by AUTH</text>
<text class="lbl" x="726" y="182">REPLY</text>
<text class="mono" x="726" y="202">OK RESULTS 2 101 "doc 7"</text>
<text class="hb" x="726" y="302">MySQL</text>
<text class="s" x="726" y="322">source of truth; writes go here</text>
<text class="lbl" x="38" y="298">ON THE WIRE</text>
<text class="mono" x="38" y="324">SEARCH articles "machine learning" FILTER status = "AND" LIMIT 10</text>
<text class="s" x="814" y="264" text-anchor="end">binlog replication</text>
<text class="s" x="480" y="368" text-anchor="middle">Callers pass raw text: the client quotes every value by one rule on the way out and unquotes values on the way back.</text>
</svg>
