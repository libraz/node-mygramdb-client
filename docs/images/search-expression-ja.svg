<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Web 形式の検索式の変換</title>
<desc id="fig-desc">convertSearchExpression() は入力 golang &quot;machine learning&quot; -php +(tutorial OR guide) を 4 つの項に分けます。接頭辞のない golang は必須語として AND で結合されます。フレーズ machine learning は空白を含むため、クォートして送られます。必須グループ +(tutorial OR guide) は OR を括弧内に保ちます。除外語 -php は AND NOT php になります。できあがるクエリは golang AND &quot;machine learning&quot; AND (tutorial OR guide) AND NOT php で、ブール式として送信します（searchRaw()、または queryMode: &#x27;boolean&#x27; の search() で送信）。</desc>
<style>
  .bg{fill:#f8fafc} .grp{fill:#eef2f6} .chip{fill:#ffffff;stroke:#cbd5e1;stroke-width:1}
  .card{fill:#ffffff;stroke:#1d4ed8;stroke-width:1.4} .alt{fill:#ffffff;stroke:#c2410c;stroke-width:1.4}
  .seam{fill:none;stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 3}
  .ln{fill:none;stroke:#1d4ed8;stroke-width:1.4} .ah{fill:#1d4ed8}
  .ln2{fill:none;stroke:#c2410c;stroke-width:1.4} .ah2{fill:#c2410c}
  .lnd{fill:none;stroke:#1d4ed8;stroke-width:1.4;stroke-dasharray:5 4}
  text{font-family:"IBM Plex Sans","Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;fill:#334155}
  .h{font-size:12.5px;fill:#0f172a} .hb{font-size:12.5px;font-weight:600;fill:#0f172a}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;fill:#64748b}
  .s{font-size:10.5px;fill:#64748b}
  .mono{font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;font-size:11px;fill:#0f172a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .grp{fill:#161b22} .chip{fill:#1c2128;stroke:#3a4a63}
    .card{fill:#1c2128;stroke:#60a5fa} .alt{fill:#1c2128;stroke:#fb923c}
    .seam{stroke:#3a4a63}
    .ln{stroke:#60a5fa} .ah{fill:#60a5fa} .ln2{stroke:#fb923c} .ah2{fill:#fb923c} .lnd{stroke:#60a5fa}
    text{fill:#cbd5e1} .h,.hb,.mono{fill:#e8eefb} .lbl,.s{fill:#94a3b8}
  }
</style>
