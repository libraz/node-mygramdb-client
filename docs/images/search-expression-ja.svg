<text class="lbl" x="194" y="43">入力（Web 形式）</text>
<text class="mono" x="194" y="66">golang "machine learning" -php +(tutorial OR guide)</text>
<text class="mono" x="490" y="96">convertSearchExpression()</text>
<text class="mono" x="36" y="146">golang</text>
<text class="hb" x="36" y="168">接頭辞のない語</text>
<text class="s" x="36" y="185">必須語として AND で結合</text>
<text class="mono" x="36" y="214">golang</text>
<text class="mono" x="269" y="146">"machine learning"</text>
<text class="hb" x="269" y="168">フレーズ</text>
<text class="s" x="269" y="185">空白を含むためクォート</text>
<text class="mono" x="269" y="214">"machine learning"</text>
<text class="mono" x="502" y="146">+(tutorial OR guide)</text>
<text class="hb" x="502" y="168">必須グループ</text>
<text class="s" x="502" y="185">OR は括弧内に保持</text>
<text class="mono" x="502" y="214">(tutorial OR guide)</text>
<text class="mono" x="735" y="146">-php</text>
<text class="hb" x="735" y="168">除外語</text>
<text class="s" x="735" y="185">AND NOT で結合</text>
<text class="mono" x="735" y="214">AND NOT php</text>
<text class="lbl" x="38" y="272">サーバーへ送るクエリ</text>
<text class="mono" x="38" y="298">golang AND "machine learning" AND (tutorial OR guide) AND NOT php</text>
<text class="s" x="922" y="298" text-anchor="end">searchRaw()、または queryMode: 'boolean' の search() で送信</text>
<text class="s" x="480" y="342" text-anchor="middle">すべての項は AND で結合されます。空の語、予約語、空白や引用符を含む語はクォートして送られます。</text>
</svg>
